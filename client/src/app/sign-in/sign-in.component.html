<form
  #form="ngForm"
  (ngSubmit)="form.valid && signin(username.value, password.value)"
  [ngFormOptions]="{updateOn: 'submit'}"
  novalidate
>
  <div>
    <h1>Sign In</h1>

    <label for="username">Username</label>
    <div>
      <input
        #username="ngModel"
        autocapitalize="off"
        autocomplete="username"
        id="username"
        maxlength="255"
        name="username"
        ngModel
        required
        spellcheck="false"
      />
      @if (form.submitted && username.invalid) {
        <div class="input-error">
          @if (username.errors?.['required']) {
            <span>Username is mandatory</span>
          }
        </div>
      }
    </div>

    <label for="password">Password</label>
    <div>
      <input
        #password="ngModel"
        autocomplete="current-password"
        id="password"
        maxlength="256"
        name="password"
        ngModel
        required
        type="password"
      />

      @if (form.submitted && password.invalid) {
        <div class="input-error">
          @if (password.errors?.['required']) {
            <span>Password is mandatory</span>
          }
        </div>
      }
    </div>

    <button [disabled]="submitting()" type="submit">Sign In</button>
    <button routerLink="/signup" type="button">Sign Up</button>
  </div>
</form>
