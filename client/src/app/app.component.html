@if (toast(); as message) {
  <div class="toast" role="alert">
    <strong>{{ message.summary }}</strong>
    <span>{{ message.detail }}</span>
  </div>
}
<div class="main">
  <header>
    <a class="logo" routerLink="/home">
      <h1>2FA</h1>
    </a>
  </header>
  <div class="toolbar">
    <h2>Two-Factor Authentication Demo with Spring and Angular</h2>
    @if (authenticated()) {
      <button (click)="signout()" [disabled]="signingOut()" class="signout" type="button">
        Sign Out
      </button>
    }
  </div>
  <nav>
    <ul>
      @if (authenticated()) {
        <li>
          <a routerLink="/home">Home</a>
        </li>
      }
    </ul>
  </nav>
  <main>
    <ngx-loading-bar [fixed]="false" [includeSpinner]="false" height="8px" />
    <router-outlet />
  </main>
  <footer>
    <span>{{ currentYear }} 2FA Demo</span>
  </footer>
</div>
