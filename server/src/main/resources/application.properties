server.port=8080
spring.web.resources.add-mappings=false

server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=20m

# Public demo credentials are only seeded when explicitly enabled on a fresh database.
app.demo-users.enabled=false

# Use the prod Spring profile with HTTPS in deployed environments.
app.security.secure-cookies=false

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:./db/test
spring.datasource.username=sa
spring.datasource.password=sa


